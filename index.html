<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Lompat Pagar 🏃‍♂️🚧</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      user-select: none;
      position: relative;
    }

    /* --- KOTAK LOGO POJOK KIRI ATAS (5 KOLOM) --- */
    .logo-corner {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 10px;
      background-color: #1e293b;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid #334155;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      z-index: 10;
    }

    .logo-box {
      width: 45px;
      height: 45px;
      border-radius: 8px;
      overflow: hidden;
      background-color: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #475569;
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Penyesuaian untuk layar HP agar tidak menutupi judul */
    @media (max-width: 900px) {
      .logo-corner {
        position: static;
        margin-bottom: 15px;
      }
    }

    h1 {
      margin-bottom: 15px;
      font-size: 2.2rem;
      color: #38bdf8;
      text-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
    }

    /* Papan Skor */
    .scoreboard {
      display: flex;
      gap: 20px;
      background-color: #1e293b;
      padding: 12px 25px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      margin-bottom: 15px;
      border: 1px solid #334155;
    }

    .score-item {
      text-align: center;
      min-width: 80px;
    }

    .score-item span {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .score-item strong {
      font-size: 1.4rem;
      color: #38bdf8;
    }

    .score-item strong.gold { color: #f59e0b; }
    .score-item strong.green { color: #4ade80; }

    /* Container Canvas Game */
    .game-container {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
      border: 4px solid #334155;
    }

    canvas {
      background: linear-gradient(to bottom, #1e1b4b, #312e81, #0284c7);
      display: block;
      cursor: pointer;
    }

    .instructions {
      margin-top: 15px;
      color: #94a3b8;
      font-size: 0.95rem;
      text-align: center;
      max-width: 600px;
    }

    kbd {
      background-color: #334155;
      color: #f8fafc;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- 5 KOLOM LOGO POJOK KIRI ATAS -->
  <div class="logo-corner">
    <div class="logo-box"><img src="l2.jpeg" alt="Logo 1"></div>
    <div class="logo-box"><img src="l3.jpeg" alt="Logo 2"></div>
    <div class="logo-box"><img src="l4.jpeg" alt="Logo 3"></div>
    <div class="logo-box"><img src="l5.jpeg" alt="Logo 4"></div>
    <div class="logo-box"><img src="l7.jpeg" alt="Logo 5"></div>
  </div>

  <h1>Lompat Pagar 🏃‍♂️🚧</h1>

  <!-- Papan Skor & Level -->
  <div class="scoreboard">
    <div class="score-item">
      <span>Skor</span>
      <strong id="scoreText" class="gold">0</strong>
    </div>
    <div class="score-item">
      <span>High Score</span>
      <strong id="highScoreText">0</strong>
    </div>
    <div class="score-item">
      <span>Level</span>
      <strong id="levelText" class="green">1</strong>
    </div>
  </div>

  <!-- Area Permainan Canvas -->
  <div class="game-container">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
  </div>

  <div class="instructions">
    <b>Cara Bermain:</b> Tekan <kbd>SPASI</kbd> / <kbd>Panah Atas</kbd> atau <b>Klik/Tap Layar</b> untuk melompat melompati pagar 🚧.
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Elemen Skor DOM
    const scoreText = document.getElementById('scoreText');
    const highScoreText = document.getElementById('highScoreText');
    const levelText = document.getElementById('levelText');

    // Opsi Opsional: Jika Anda punya gambar file orang sendiri (misal: player.png), baris ini akan menggunakannya.
    const playerImg = new Image();
    playerImg.src = 'player.png';

    // --- SYSTEM AUDIO (Web Audio API) ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'jump') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(450, now + 0.15);
        gainNode.gain.setValueAtTime(0.3, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } 
      else if (type === 'score') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.08);
        gainNode.gain.setValueAtTime(0.2, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      }
      else if (type === 'levelup') {
        const notes = [440, 554.37, 659.25, 880];
        notes.forEach((freq, idx) => {
          const noteOsc = audioCtx.createOscillator();
          const noteGain = audioCtx.createGain();
          noteOsc.connect(noteGain);
          noteOsc.connect(audioCtx.destination);
          
          noteOsc.type = 'sine';
          noteOsc.frequency.setValueAtTime(freq, now + idx * 0.1);
          noteGain.gain.setValueAtTime(0.2, now + idx * 0.1);
          noteGain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.2);
          
          noteOsc.start(now + idx * 0.1);
          noteOsc.stop(now + idx * 0.1 + 0.2);
        });
      }
      else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.4);
        gainNode.gain.setValueAtTime(0.4, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      }
    }

    // --- GAME VARIABLES ---
    let gameState = 'START';
    let score = 0;
    let highScore = localStorage.getItem('hurdle_highscore') || 0;
    highScoreText.textContent = highScore;

    let level = 1;
    let gameSpeed = 5;
    const groundY = 320;

    // Pemain
    const player = {
      x: 100,
      y: groundY - 55,
      width: 32,
      height: 55,
      vy: 0,
      gravity: 0.7,
      jumpForce: -13.5,
      isGrounded: true,
      runFrame: 0
    };

    // Obstacles (Pagar)
    let fences = [];
    let spawnTimer = 0;
    let minSpawnInterval = 90;

    // Partikel
    let particles = [];
    let floatingTexts = [];

    // --- KONTROL / EVENT LISTENER ---
    function triggerJump() {
      initAudio();

      if (gameState === 'START' || gameState === 'GAMEOVER') {
        resetGame();
        gameState = 'PLAYING';
        return;
      }

      if (player.isGrounded && gameState === 'PLAYING') {
        player.vy = player.jumpForce;
        player.isGrounded = false;
        playSound('jump');
        createParticles(player.x + player.width / 2, groundY, '#fef08a', 8);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        e.preventDefault();
        triggerJump();
      }
    });

    canvas.addEventListener('mousedown', (e) => {
      e.preventDefault();
      triggerJump();
    });

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      triggerJump();
    }, { passive: false });

    // --- GAME LOGIC ---
    function resetGame() {
      score = 0;
      level = 1;
      gameSpeed = 5;
      fences = [];
      particles = [];
      floatingTexts = [];
      player.y = groundY - player.height;
      player.vy = 0;
      player.isGrounded = true;
      
      scoreText.textContent = score;
      levelText.textContent = level;
    }

    function createParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 1) * 3,
          size: Math.random() * 4 + 2,
          color: color,
          alpha: 1
        });
      }
    }

    function addFloatingText(text, x, y, color = '#f59e0b') {
      floatingTexts.push({ text, x, y, alpha: 1, color });
    }

    function update() {
      if (gameState !== 'PLAYING') return;

      player.vy += player.gravity;
      player.y += player.vy;

      if (player.y >= groundY - player.height) {
        if (!player.isGrounded) {
          createParticles(player.x + player.width / 2, groundY, '#cbd5e1', 5);
        }
        player.y = groundY - player.height;
        player.vy = 0;
        player.isGrounded = true;
      }

      player.runFrame += 0.25;

      spawnTimer++;
      const currentInterval = Math.max(45, minSpawnInterval - (level * 5));
      if (spawnTimer > currentInterval + Math.random() * 30) {
        spawnTimer = 0;

        const h = 35 + Math.random() * 20;
        const w = 20 + Math.random() * 10;
        fences.push({
          x: canvas.width + 20,
          y: groundY - h,
          width: w,
          height: h,
          passed: false
        });
      }

      for (let i = fences.length - 1; i >= 0; i--) {
        let f = fences[i];
        f.x -= gameSpeed;

        if (!f.passed && f.x + f.width < player.x) {
          f.passed = true;
          score += 10;
          scoreText.textContent = score;
          playSound('score');
          addFloatingText('+10', player.x, player.y - 10);

          if (score % 50 === 0) {
            level++;
            gameSpeed += 0.8;
            levelText.textContent = level;
            playSound('levelup');
            addFloatingText(`LEVEL ${level}! 🚀`, canvas.width / 2, 100, '#38bdf8');
          }

          if (score > highScore) {
            highScore = score;
            highScoreText.textContent = highScore;
            localStorage.setItem('hurdle_highscore', highScore);
          }
        }

        const hitMargin = 4;
        if (
          player.x + hitMargin < f.x + f.width &&
          player.x + player.width - hitMargin > f.x &&
          player.y + hitMargin < f.y + f.height &&
          player.y + player.height - hitMargin > f.y
        ) {
          playSound('hit');
          createParticles(player.x + player.width / 2, player.y + player.height / 2, '#ef4444', 20);
          gameState = 'GAMEOVER';
        }

        if (f.x + f.width < -50) {
          fences.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.03;
        if (p.alpha <= 0) particles.splice(i, 1);
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        let ft = floatingTexts[i];
        ft.y -= 1;
        ft.alpha -= 0.02;
        if (ft.alpha <= 0) floatingTexts.splice(i, 1);
      }
    }

    // --- DRAWING / VISUAL ---
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Background / Bulan
      ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.beginPath();
      ctx.arc(700, 80, 40, 0, Math.PI * 2);
      ctx.fill();

      // Lapangan
      ctx.fillStyle = '#15803d';
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

      ctx.fillStyle = '#ca8a04';
      ctx.fillRect(0, groundY, canvas.width, 8);

      // Pagar
      fences.forEach(f => {
        ctx.fillStyle = '#b45309';
        ctx.fillRect(f.x, f.y, f.width, f.height);

        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(f.x - 2, f.y + 4, f.width + 4, 6);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(f.x - 2, f.y + 16, f.width + 4, 6);

        ctx.fillStyle = '#78350f';
        ctx.fillRect(f.x - 4, groundY - 4, f.width + 8, 4);
      });

      // Runner (Pelari)
      drawRunner(player.x, player.y, player.width, player.height);

      // Partikel
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      });

      // Teks Melayang
      floatingTexts.forEach(ft => {
        ctx.fillStyle = ft.color;
        ctx.globalAlpha = Math.max(0, ft.alpha);
        ctx.font = 'bold 20px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.globalAlpha = 1.0;
      });

      if (gameState === 'START' || gameState === 'GAMEOVER') {
        drawOverlay();
      }
    }

    // FUNGSI MENGGAMBAR KARAKTER ORANG DETAILE
    function drawRunner(x, y, w, h) {
      const cx = x + w / 2;

      // 1. Bayangan Karakter
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(cx, groundY - 2, 16, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Jika file 'player.png' dipasang dan berhasil dimuat, gambar file tersebut
      if (playerImg.complete && playerImg.naturalWidth !== 0) {
        ctx.drawImage(playerImg, x, y, w, h);
        return;
      }

      // --- PENGGAMBARAN KARAKTER MANUSIA (PELARI) ---
      const isJumping = !player.isGrounded;
      const legAngle = isJumping ? 0.7 : Math.sin(player.runFrame) * 0.7;
      const armAngle = isJumping ? -0.7 : Math.cos(player.runFrame) * 0.7;

      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // 2. Kaki Belakang
      ctx.strokeStyle = '#f87171'; // Kaki
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(cx, y + 34);
      const backFootX = cx - Math.sin(legAngle) * 14;
      const backFootY = y + 52;
      ctx.lineTo(backFootX, backFootY);
      ctx.stroke();

      // Sepatu Belakang
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(backFootX - 4, backFootY - 2, 8, 4);

      // 3. Tangan Belakang
      ctx.strokeStyle = '#fbcfe8';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(cx, y + 18);
      ctx.lineTo(cx - Math.sin(armAngle) * 12, y + 28);
      ctx.stroke();

      // 4. Celana Olahraga
      ctx.fillStyle = '#1e3a8a';
      ctx.fillRect(cx - 7, y + 28, 14, 10);

      // 5. Baju / Kaos Olahraga
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(cx - 8, y + 15, 16, 14);

      // Nombor Dada / Strip Baju
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(cx - 5, y + 19, 10, 6);

      // 6. Kaki Depan
      ctx.strokeStyle = '#f87171';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(cx, y + 34);
      const frontFootX = cx + Math.sin(legAngle) * 14;
      const frontFootY = y + 52;
      ctx.lineTo(frontFootX, frontFootY);
      ctx.stroke();

      // Sepatu Depan
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(frontFootX - 4, frontFootY - 2, 8, 4);

      // 7. Kepala & Wajah
      ctx.fillStyle = '#fbcfe8'; // Warna Kulit
      ctx.beginPath();
      ctx.arc(cx, y + 8, 8, 0, Math.PI * 2);
      ctx.fill();

      // Rambut
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(cx, y + 6, 8.5, Math.PI * 0.8, Math.PI * 2.2);
      ctx.fill();

      // Ikat Kepala (Headband)
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(cx - 8, y + 4, 16, 3);

      // Mata
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(cx + 3, y + 8, 1.5, 0, Math.PI * 2);
      ctx.fill();

      // 8. Tangan Depan
      ctx.strokeStyle = '#fbcfe8';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(cx, y + 18);
      ctx.lineTo(cx + Math.sin(armAngle) * 12, y + 28);
      ctx.stroke();
    }

    function drawOverlay() {
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.textAlign = 'center';

      if (gameState === 'START') {
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 32px Segoe UI';
        ctx.fillText('LOMPAT PAGAR 🏃‍♂️🚧', canvas.width / 2, canvas.height / 2 - 30);

        ctx.fillStyle = '#f8fafc';
        ctx.font = '18px Segoe UI';
        ctx.fillText('Klik / Tekan SPASI untuk Memulai!', canvas.width / 2, canvas.height / 2 + 20);
      } else if (gameState === 'GAMEOVER') {
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 36px Segoe UI';
        ctx.fillText('GAME OVER! 💥', canvas.width / 2, canvas.height / 2 - 40);

        ctx.fillStyle = '#f8fafc';
        ctx.font = '20px Segoe UI';
        ctx.fillText(`Skor Akhir: ${score} | Level: ${level}`, canvas.width / 2, canvas.height / 2 + 5);

        ctx.fillStyle = '#38bdf8';
        ctx.font = '16px Segoe UI';
        ctx.fillText('Klik / Tekan SPASI untuk Main Lagi', canvas.width / 2, canvas.height / 2 + 55);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
